# Não é o builder ativo. railway.json usa DOCKERFILE (server/Dockerfile).
# Sem [variables]: o Nixpacks copiava env do serviço para `ENV name=$name`
# e gerava `ENV =$` quando existia variável com nome em branco.
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "node index.js"
